<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - 图书销售管理系统'">图书销售管理系统</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
    <style>
        .navbar-brand {
            font-weight: bold;
        }
        .sidebar {
            min-height: calc(100vh - 56px);
            background-color: #f8f9fa;
        }
        .main-content {
            min-height: calc(100vh - 56px);
            padding: 20px;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-book"></i> 图书销售管理系统</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3" th:if="${user}">
                    欢迎，<span th:text="${user.userName}"></span>
                    <span class="badge bg-secondary ms-2" th:if="${user.role == 1}">管理员</span>
                </span>
                <a class="nav-link" th:href="@{/logout}">退出</a>
            </div>
        </div>
    </nav>
    
    <div class="container-fluid">
        <div class="row">
            <div class="col-md-2 sidebar p-3" th:if="${user}">
                <div th:if="${user.role == 1}">
                    <h5>管理员菜单</h5>
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" th:href="@{/admin/books}">图书管理</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/admin/users}">用户管理</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/admin/statistics}">销量统计</a></li>
                    </ul>
                </div>
                <div th:if="${user.role == 0}">
                    <h5>用户菜单</h5>
                    <ul class="nav flex-column">
                        <li class="nav-item"><a class="nav-link" th:href="@{/user/books}">图书浏览</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/user/cart}">购物车</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/user/orders}">我的订单</a></li>
                        <li class="nav-item"><a class="nav-link" th:href="@{/user/profile}">个人信息</a></li>
                    </ul>
                </div>
            </div>
            <div class="col-md-10 main-content" th:classappend="${user ? 'col-md-10' : 'col-md-12'}">
                <div th:replace="${content}"></div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
