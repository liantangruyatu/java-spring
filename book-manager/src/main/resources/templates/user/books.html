<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书浏览</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.7.2/font/bootstrap-icons.css">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-book"></i> 图书销售管理系统</a>
            <div class="navbar-nav ms-auto">
                <span class="navbar-text me-3">欢迎，<span th:text="${user.userName}"></span></span>
                <a class="nav-link" th:href="@{/user/cart}"><i class="bi bi-cart"></i> 购物车</a>
                <a class="nav-link" th:href="@{/user/orders}">我的订单</a>
                <a class="nav-link" th:href="@{/user/profile}">个人信息</a>
                <a class="nav-link" th:href="@{/logout}">退出</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <h2>图书浏览</h2>
        
        <!-- 搜索表单 -->
        <form th:action="@{/user/books}" method="get" class="mb-4">
            <div class="row g-3">
                <div class="col-md-3">
                    <input type="text" class="form-control" name="bookName" placeholder="图书名称" th:value="${bookName}">
                </div>
                <div class="col-md-2">
                    <select class="form-select" name="categoryId">
                        <option value="">全部类别</option>
                        <option th:each="cat : ${categories}" 
                                th:value="${cat.categoryId}" 
                                th:text="${cat.categoryName}"
                                th:selected="${categoryId == cat.categoryId}"></option>
                    </select>
                </div>
                <div class="col-md-2">
                    <input type="number" class="form-control" name="minPrice" placeholder="最低价格" th:value="${minPrice}" step="0.01">
                </div>
                <div class="col-md-2">
                    <input type="number" class="form-control" name="maxPrice" placeholder="最高价格" th:value="${maxPrice}" step="0.01">
                </div>
                <div class="col-md-3">
                    <button type="submit" class="btn btn-primary">搜索</button>
                    <a th:href="@{/user/books}" class="btn btn-secondary">重置</a>
                </div>
            </div>
        </form>
        
        <!-- 图书列表 -->
        <div class="row">
            <div class="col-md-3 mb-4" th:each="book : ${books}">
                <div class="card h-100">
                    <div class="card-body">
                        <h5 class="card-title" th:text="${book.bookName}"></h5>
                        <p class="card-text">
                            <small class="text-muted">作者：<span th:text="${book.author}"></span></small><br>
                            <small class="text-muted">出版社：<span th:text="${book.press}"></span></small><br>
                            <small class="text-muted">类别：<span th:text="${book.categoryName}"></span></small>
                        </p>
                        <p class="card-text" th:text="${book.description}"></p>
                        <div class="d-flex justify-content-between align-items-center">
                            <span class="text-danger fw-bold">¥<span th:text="${book.price}"></span></span>
                            <span class="badge bg-info">库存：<span th:text="${book.stock}"></span></span>
                        </div>
                    </div>
                    <div class="card-footer">
                        <a th:href="@{'/user/book/' + ${book.bookId}}" class="btn btn-sm btn-primary">查看详情</a>
                    </div>
                </div>
            </div>
        </div>
        
        <div th:if="${books.isEmpty()}" class="alert alert-info">暂无图书</div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
