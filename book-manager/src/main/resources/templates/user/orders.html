<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的订单</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-book"></i> 图书销售管理系统</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/user/books}">图书浏览</a>
                <a class="nav-link" th:href="@{/user/cart}">购物车</a>
                <a class="nav-link" th:href="@{/logout}">退出</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <h2>我的订单</h2>
        
        <div th:if="${orders.isEmpty()}" class="alert alert-info">暂无订单</div>
        
        <div th:each="order : ${orders}" class="card mb-3">
            <div class="card-header d-flex justify-content-between">
                <span>订单号：<span th:text="${order.orderNo}"></span></span>
                <span>
                    <span th:switch="${order.status}">
                        <span th:case="0" class="badge bg-warning">待支付</span>
                        <span th:case="1" class="badge bg-info">已支付</span>
                        <span th:case="2" class="badge bg-primary">已发货</span>
                        <span th:case="3" class="badge bg-success">已完成</span>
                        <span th:case="4" class="badge bg-danger">已取消</span>
                    </span>
                </span>
            </div>
            <div class="card-body">
                <p>下单时间：<span th:text="${order.orderDate}"></span></p>
                <p>总金额：<span class="text-danger fw-bold">¥<span th:text="${order.totalAmount}"></span></span></p>
                <p>收货人：<span th:text="${order.receiverName}"></span> <span th:text="${order.receiverPhone}"></span></p>
                <p>收货地址：<span th:text="${order.receiverAddr}"></span></p>
                <h6>订单明细：</h6>
                <ul th:if="${order.items}">
                    <li th:each="item : ${order.items}">
                        <span th:text="${item.bookName}"></span> × 
                        <span th:text="${item.quantity}"></span> = 
                        ¥<span th:text="${item.subtotal}"></span>
                    </li>
                </ul>
                <div class="mt-2">
                    <a th:href="@{'/user/order/' + ${order.orderId}}" class="btn btn-sm btn-primary">查看详情</a>
                    <a th:if="${order.status == 0}" 
                       th:href="@{'/user/order/pay/' + ${order.orderId}}" 
                       class="btn btn-sm btn-success">支付</a>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
