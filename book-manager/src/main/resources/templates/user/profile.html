<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人信息</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-book"></i> 图书销售管理系统</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/user/books}">图书浏览</a>
                <a class="nav-link" th:href="@{/logout}">退出</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <h2>个人信息</h2>
        
        <div th:if="${message}" class="alert alert-success" th:text="${message}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>
        
        <form th:action="@{/user/profile}" method="post" th:object="${user}">
            <input type="hidden" th:field="*{userId}">
            <div class="mb-3">
                <label class="form-label">用户名</label>
                <input type="text" class="form-control" th:field="*{userName}" readonly>
            </div>
            <div class="mb-3">
                <label class="form-label">密码（留空不修改）</label>
                <input type="password" class="form-control" name="password">
            </div>
            <div class="mb-3">
                <label class="form-label">手机号</label>
                <input type="text" class="form-control" th:field="*{phone}">
            </div>
            <div class="mb-3">
                <label class="form-label">邮箱</label>
                <input type="email" class="form-control" th:field="*{email}">
            </div>
            <div class="mb-3">
                <label class="form-label">地址</label>
                <input type="text" class="form-control" th:field="*{address}">
            </div>
            <button type="submit" class="btn btn-primary">保存</button>
        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
