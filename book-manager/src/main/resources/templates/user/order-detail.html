<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>订单详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-book"></i> 图书销售管理系统</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/user/orders}">返回订单列表</a>
                <a class="nav-link" th:href="@{/logout}">退出</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <h2>订单详情</h2>
        
        <div class="card">
            <div class="card-header">
                <h5>订单号：<span th:text="${order.orderNo}"></span></h5>
                <span th:switch="${order.status}">
                    <span th:case="0" class="badge bg-warning">待支付</span>
                    <span th:case="1" class="badge bg-info">已支付</span>
                    <span th:case="2" class="badge bg-primary">已发货</span>
                    <span th:case="3" class="badge bg-success">已完成</span>
                    <span th:case="4" class="badge bg-danger">已取消</span>
                </span>
            </div>
            <div class="card-body">
                <p><strong>下单时间：</strong><span th:text="${order.orderDate}"></span></p>
                <p><strong>总金额：</strong><span class="text-danger fw-bold">¥<span th:text="${order.totalAmount}"></span></span></p>
                <p><strong>收货人：</strong><span th:text="${order.receiverName}"></span></p>
                <p><strong>联系电话：</strong><span th:text="${order.receiverPhone}"></span></p>
                <p><strong>收货地址：</strong><span th:text="${order.receiverAddr}"></span></p>
                
                <h5 class="mt-4">订单明细</h5>
                <table class="table">
                    <thead>
                        <tr>
                            <th>图书名称</th>
                            <th>单价</th>
                            <th>数量</th>
                            <th>小计</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${order.items}">
                            <td th:text="${item.bookName}"></td>
                            <td>¥<span th:text="${item.unitPrice}"></span></td>
                            <td th:text="${item.quantity}"></td>
                            <td>¥<span th:text="${item.subtotal}"></span></td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
