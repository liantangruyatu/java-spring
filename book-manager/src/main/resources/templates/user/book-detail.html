<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>图书详情</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-book"></i> 图书销售管理系统</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/user/books}">返回列表</a>
                <a class="nav-link" th:href="@{/logout}">退出</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-8">
                <h2 th:text="${book.bookName}"></h2>
                <hr>
                <p><strong>作者：</strong><span th:text="${book.author}"></span></p>
                <p><strong>出版社：</strong><span th:text="${book.press}"></span></p>
                <p><strong>ISBN：</strong><span th:text="${book.isbn}"></span></p>
                <p><strong>出版日期：</strong><span th:text="${book.publishDate}"></span></p>
                <p><strong>库存：</strong><span th:text="${book.stock}"></span></p>
                <p><strong>销量：</strong><span th:text="${book.salesVolume}"></span></p>
                <hr>
                <h4>简介</h4>
                <p th:text="${book.description}"></p>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body text-center">
                        <h3 class="text-danger">¥<span th:text="${book.price}"></span></h3>
                        <form id="addCartForm">
                            <input type="hidden" name="bookId" th:value="${book.bookId}">
                            <div class="mb-3">
                                <label for="quantity" class="form-label">数量</label>
                                <input type="number" class="form-control" id="quantity" name="quantity" value="1" min="1" th:max="${book.stock}">
                            </div>
                            <button type="button" class="btn btn-primary w-100" onclick="addToCart()">加入购物车</button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function addToCart() {
            const form = document.getElementById('addCartForm');
            const formData = new FormData(form);
            
            fetch('/user/cart/add', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(data => {
                if (data === 'success') {
                    alert('已添加到购物车');
                } else {
                    alert(data);
                }
            });
        }
    </script>
</body>
</html>
