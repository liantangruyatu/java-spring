<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>购物车</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-book"></i> 图书销售管理系统</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/user/books}">图书浏览</a>
                <a class="nav-link" th:href="@{/user/orders}">我的订单</a>
                <a class="nav-link" th:href="@{/logout}">退出</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <h2>购物车</h2>
        
        <div th:if="${carts.isEmpty()}" class="alert alert-info">购物车为空</div>
        
        <table class="table" th:if="${!carts.isEmpty()}">
            <thead>
                <tr>
                    <th>图书名称</th>
                    <th>单价</th>
                    <th>数量</th>
                    <th>小计</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="cart : ${carts}">
                    <td th:text="${books[cart.bookId].bookName}"></td>
                    <td>¥<span th:text="${books[cart.bookId].price}"></span></td>
                    <td>
                        <input type="number" class="form-control form-control-sm" 
                               th:value="${cart.quantity}" 
                               th:id="'qty_' + ${cart.cartId}"
                               min="1" 
                               th:max="${books[cart.bookId].stock}"
                               onchange="updateCart([[${cart.cartId}]], this.value)">
                    </td>
                    <td>¥<span th:text="${books[cart.bookId].price * cart.quantity}"></span></td>
                    <td>
                        <a th:href="@{'/user/cart/delete/' + ${cart.cartId}}" class="btn btn-sm btn-danger">删除</a>
                    </td>
                </tr>
            </tbody>
        </table>
        
        <div th:if="${!carts.isEmpty()}" class="mt-4">
            <form th:action="@{/user/order/create}" method="post">
                <h4>收货信息</h4>
                <div class="row mb-3">
                    <div class="col-md-4">
                        <input type="text" class="form-control" name="receiverName" placeholder="收货人姓名" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" name="receiverPhone" placeholder="收货人电话" required>
                    </div>
                    <div class="col-md-4">
                        <input type="text" class="form-control" name="receiverAddr" placeholder="收货地址" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-success btn-lg">提交订单</button>
            </form>
        </div>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        function updateCart(cartId, quantity) {
            const formData = new FormData();
            formData.append('cartId', cartId);
            formData.append('quantity', quantity);
            
            fetch('/user/cart/update', {
                method: 'POST',
                body: formData
            })
            .then(response => response.text())
            .then(data => {
                if (data === 'success') {
                    location.reload();
                } else {
                    alert(data);
                }
            });
        }
    </script>
</body>
</html>
