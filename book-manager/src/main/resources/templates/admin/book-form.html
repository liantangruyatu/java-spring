<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${book?.bookId != null ? '编辑图书' : '添加图书'}">图书表单</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-book"></i> 图书销售管理系统</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/admin/books}">返回列表</a>
                <a class="nav-link" th:href="@{/logout}">退出</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <h2 th:text="${book?.bookId != null ? '编辑图书' : '添加图书'}">图书表单</h2>
        
        <form th:action="@{/admin/book/save}" method="post" th:object="${book}">
            <input type="hidden" th:field="*{bookId}" th:value="${book?.bookId}">
            <div class="mb-3">
                <label class="form-label">书名</label>
                <input type="text" class="form-control" th:field="*{bookName}" required>
            </div>
            <div class="mb-3">
                <label class="form-label">作者</label>
                <input type="text" class="form-control" th:field="*{author}">
            </div>
            <div class="mb-3">
                <label class="form-label">出版社</label>
                <input type="text" class="form-control" th:field="*{press}">
            </div>
            <div class="mb-3">
                <label class="form-label">ISBN</label>
                <input type="text" class="form-control" th:field="*{isbn}">
            </div>
            <div class="mb-3">
                <label class="form-label">类别</label>
                <select class="form-select" th:field="*{categoryId}">
                    <option value="">请选择</option>
                    <option th:each="cat : ${categories}" 
                            th:value="${cat.categoryId}" 
                            th:text="${cat.categoryName}"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">价格</label>
                <input type="number" class="form-control" th:field="*{price}" step="0.01" min="0" required>
            </div>
            <div class="mb-3">
                <label class="form-label">库存</label>
                <input type="number" class="form-control" th:field="*{stock}" min="0" required>
            </div>
            <div class="mb-3">
                <label class="form-label">简介</label>
                <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
            </div>
            <button type="submit" class="btn btn-primary">保存</button>
            <a th:href="@{/admin/books}" class="btn btn-secondary">取消</a>
        </form>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
