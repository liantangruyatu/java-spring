<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>销量统计</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-book"></i> 图书销售管理系统</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/admin/books}">图书管理</a>
                <a class="nav-link" th:href="@{/admin/users}">用户管理</a>
                <a class="nav-link" th:href="@{/logout}">退出</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <h2>销量统计</h2>
        
        <h4 class="mt-4">销量TOP10</h4>
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>排名</th>
                    <th>书名</th>
                    <th>作者</th>
                    <th>销量</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="book, iterStat : ${topBooks}">
                    <td th:text="${iterStat.index + 1}"></td>
                    <td th:text="${book.bookName}"></td>
                    <td th:text="${book.author}"></td>
                    <td th:text="${book.salesVolume}"></td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
