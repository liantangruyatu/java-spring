<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>用户管理</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary">
        <div class="container-fluid">
            <a class="navbar-brand" href="#"><i class="bi bi-book"></i> 图书销售管理系统</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link" th:href="@{/admin/books}">图书管理</a>
                <a class="nav-link" th:href="@{/admin/statistics}">销量统计</a>
                <a class="nav-link" th:href="@{/logout}">退出</a>
            </div>
        </div>
    </nav>
    
    <div class="container mt-4">
        <h2>用户管理</h2>
        
        <table class="table table-striped">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>用户名</th>
                    <th>手机号</th>
                    <th>邮箱</th>
                    <th>地址</th>
                    <th>角色</th>
                    <th>状态</th>
                    <th>操作</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="user : ${users}">
                    <td th:text="${user.userId}"></td>
                    <td th:text="${user.userName}"></td>
                    <td th:text="${user.phone}"></td>
                    <td th:text="${user.email}"></td>
                    <td th:text="${user.address}"></td>
                    <td>
                        <span th:if="${user.role == 1}" class="badge bg-danger">管理员</span>
                        <span th:if="${user.role == 0}" class="badge bg-secondary">用户</span>
                    </td>
                    <td>
                        <span th:if="${user.status == 1}" class="badge bg-success">正常</span>
                        <span th:if="${user.status == 0}" class="badge bg-warning">禁用</span>
                    </td>
                    <td>
                        <a th:href="@{'/admin/user/edit/' + ${user.userId}}" class="btn btn-sm btn-primary">编辑</a>
                        <a th:href="@{'/admin/user/delete/' + ${user.userId}}" 
                           class="btn btn-sm btn-danger" 
                           onclick="return confirm('确定删除吗？')">删除</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
