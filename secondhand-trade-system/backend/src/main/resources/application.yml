spring:
  application:
    name: secondhand-trade
  datasource:
    url: jdbc:mysql://localhost:3306/second_hand_trade?useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true
    username: root
    password: YOUR_DB_PASSWORD
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQL8Dialect
        format_sql: true
  mvc:
    cors:
      allowed-origins: http://localhost:8080,http://localhost:3000,http://localhost:5173
      allowed-methods: GET,POST,PUT,DELETE,OPTIONS
      allowed-headers: "*"
      max-age: 3600

server:
  port: 8080
  servlet:
    context-path: /api

logging:
  level:
    root: INFO
    com.nuc: DEBUG
  pattern:
    console: "%d{HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

# MyBatis Plus配置
mybatis-plus:
  mapper-locations: classpath:/mapper/*.xml
  type-aliases-package: com.nuc.secondhand.entity
  configuration:
    map-underscore-to-camel-case: true
    cache-enabled: false
