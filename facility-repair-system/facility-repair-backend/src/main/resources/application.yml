spring:
  application:
    name: facility-repair-system
  
  # 数据源配置
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/facility_repair_db?useSSL=false&serverTimezone=Asia/Shanghai&allowMultiQueries=true&allowLoadLocalInfileInPath=/&autoReconnect=true&maxReconnects=5
    username: root
    password: YOUR_DB_PASSWORD
    
    # 连接池配置
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
  
  # JPA配置
  jpa:
    database-platform: org.hibernate.dialect.MySQL8Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
          fetch_size: 50
        order_inserts: true
        order_updates: true
  
  # Jackson配置
  jackson:
    serialization:
      write-dates-as-timestamps: false
      indent-output: true
    deserialization:
      fail-on-unknown-properties: false
    default-property-inclusion: non_null
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8

# 服务器配置
server:
  port: 8080
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always

# 日志配置
logging:
  level:
    root: INFO
    com.city: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: logs/facility-repair.log
    max-size: 10MB
    max-history: 10
    total-size-cap: 100MB

# 管理端点
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# 应用自定义配置
app:
  # 报修单配置
  repair:
    # 超时预警时间(小时)
    timeout-hours: 48
    # 定时检查间隔(分钟)
    check-interval: 60
  
  # 文件上传配置
  upload:
    path: /var/tmp/facility-repair/uploads
    max-size: 10485760  # 10MB
    allowed-types: jpg,jpeg,png,gif,pdf
