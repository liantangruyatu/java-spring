<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>志愿者审核</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>志愿者审核</h4>
        <a class="btn btn-outline-secondary btn-sm" href="/dashboard">返回</a>
    </div>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>用户名</th>
            <th>姓名</th>
            <th>审核状态</th>
            <th>备注</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="v : ${list}">
            <td th:text="${v.id}"></td>
            <td th:text="${v.user.username}"></td>
            <td th:text="${v.user.fullName}"></td>
            <td th:text="${v.auditStatus}"></td>
            <td th:text="${v.auditRemark}"></td>
            <td>
                <form th:action="@{'/admin/volunteers/' + ${v.id} + '/audit'}" method="post" class="d-flex gap-1">
                    <input type="hidden" name="remark" value="审核通过">
                    <button class="btn btn-sm btn-success" name="status" value="1" type="submit">通过</button>
                </form>
                <form th:action="@{'/admin/volunteers/' + ${v.id} + '/audit'}" method="post" class="mt-1">
                    <input type="hidden" name="remark" value="审核驳回">
                    <button class="btn btn-sm btn-danger" name="status" value="2" type="submit">驳回</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
