<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title th:text="${user.id != null ? '编辑用户' : '创建用户'}">用户表单</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">志愿者管理系统</a>
        <div class="d-flex">
            <a class="btn btn-outline-light btn-sm" href="/logout">退出</a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <div class="card">
                <div class="card-header">
                    <h5 th:text="${user.id != null ? '编辑用户' : '创建用户'}">用户表单</h5>
                </div>
                <div class="card-body">
                    <form th:action="@{/admin/users/save}" method="post">
                        <input type="hidden" th:if="${user.id != null}" th:name="id" th:value="${user.id}">
                        <div class="mb-3">
                            <label class="form-label">用户名 *</label>
                            <input type="text" name="username" class="form-control" th:value="${user.username}" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">密码 <span th:if="${user.id == null}">*</span></label>
                            <input type="password" name="password" class="form-control" th:required="${user.id == null}">
                            <small class="text-muted" th:if="${user.id != null}">留空则不修改密码</small>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">角色 *</label>
                            <select name="roleName" class="form-select" required>
                                <option value="">请选择</option>
                                <option th:each="r : ${roles}" 
                                        th:value="${r.name}" 
                                        th:text="${r.description}"
                                        th:selected="${user.role != null && user.role.name == r.name}"></option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">姓名</label>
                            <input type="text" name="fullName" class="form-control" th:value="${user.fullName}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">手机</label>
                            <input type="text" name="phone" class="form-control" th:value="${user.phone}">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">邮箱</label>
                            <input type="email" name="email" class="form-control" th:value="${user.email}">
                        </div>
                        <div class="d-flex gap-2">
                            <button type="submit" class="btn btn-primary">保存</button>
                            <a href="/admin/users" class="btn btn-secondary">取消</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
