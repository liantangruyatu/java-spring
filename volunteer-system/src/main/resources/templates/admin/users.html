<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>用户管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">志愿者管理系统</a>
        <div class="d-flex">
            <span class="navbar-text text-white me-3" th:text="${session.user.fullName}"></span>
            <a class="btn btn-outline-light btn-sm" href="/logout">退出</a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>用户管理</h4>
        <div>
            <a class="btn btn-primary btn-sm" href="/admin/users/new">创建用户</a>
            <a class="btn btn-outline-secondary btn-sm" href="/dashboard">返回</a>
        </div>
    </div>
    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>ID</th>
            <th>用户名</th>
            <th>姓名</th>
            <th>角色</th>
            <th>手机</th>
            <th>邮箱</th>
            <th>状态</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="u : ${list}">
            <td th:text="${u.id}"></td>
            <td th:text="${u.username}"></td>
            <td th:text="${u.fullName}"></td>
            <td th:text="${u.role.name}"></td>
            <td th:text="${u.phone}"></td>
            <td th:text="${u.email}"></td>
            <td>
                <span th:if="${u.status == 1}" class="badge bg-success">正常</span>
                <span th:if="${u.status == 0}" class="badge bg-danger">禁用</span>
            </td>
            <td>
                <a th:href="@{'/admin/users/' + ${u.id} + '/edit'}" class="btn btn-sm btn-primary">编辑</a>
                <button class="btn btn-sm btn-warning" onclick="resetPassword([[${u.id}]])">重置密码</button>
                <form th:action="@{'/admin/users/' + ${u.id} + '/delete'}" method="post" style="display:inline;" onsubmit="return confirm('确定删除吗？')">
                    <button class="btn btn-sm btn-danger" type="submit">删除</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>

<div class="modal fade" id="resetPasswordModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title">重置密码</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <form id="resetPasswordForm" method="post">
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">新密码</label>
                        <input type="password" name="newPassword" class="form-control" required>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="submit" class="btn btn-primary">确定</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    function resetPassword(userId) {
        document.getElementById('resetPasswordForm').action = '/admin/users/' + userId + '/reset-password';
        new bootstrap.Modal(document.getElementById('resetPasswordModal')).show();
    }
</script>
</body>
</html>
