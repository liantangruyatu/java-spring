<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>发布/编辑招募</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4" style="max-width: 800px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>发布/编辑招募</h4>
        <a class="btn btn-outline-secondary btn-sm" href="/admin/recruitments">返回</a>
    </div>
    <form method="post" action="/admin/recruitments/save">
        <input type="hidden" name="id" th:value="${recruitment.id}">
        <div class="mb-3">
            <label class="form-label">标题</label>
            <input class="form-control" name="title" th:value="${recruitment.title}" required>
        </div>
        <div class="mb-3">
            <label class="form-label">描述</label>
            <textarea class="form-control" name="description" rows="4" th:text="${recruitment.description}"></textarea>
        </div>
        <div class="row mb-3">
            <div class="col">
                <label class="form-label">地点</label>
                <input class="form-control" name="location" th:value="${recruitment.location}">
            </div>
            <div class="col">
                <label class="form-label">名额</label>
                <input class="form-control" name="maxVolunteers" type="number" min="1" th:value="${recruitment.maxVolunteers}">
            </div>
        </div>
        <div class="row mb-3">
            <div class="col">
                <label class="form-label">开始时间</label>
                <input class="form-control" type="datetime-local" name="startTime"
                       th:value="${recruitment.startTime != null} ? ${#dates.format(recruitment.startTime,'yyyy-MM-dd''T''HH:mm')}"
                       required>
            </div>
            <div class="col">
                <label class="form-label">结束时间</label>
                <input class="form-control" type="datetime-local" name="endTime"
                       th:value="${recruitment.endTime != null} ? ${#dates.format(recruitment.endTime,'yyyy-MM-dd''T''HH:mm')}"
                       required>
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">条件</label>
            <input class="form-control" name="requirement" th:value="${recruitment.requirement}">
        </div>
        <div class="mb-3">
            <label class="form-label">状态</label>
            <select class="form-select" name="status">
                <option value="0" th:selected="${recruitment.status == 0}">草稿</option>
                <option value="1" th:selected="${recruitment.status == 1}">发布</option>
                <option value="2" th:selected="${recruitment.status == 2}">结束</option>
            </select>
        </div>
        <button class="btn btn-primary" type="submit">保存</button>
    </form>
</div>
</body>
</html>
