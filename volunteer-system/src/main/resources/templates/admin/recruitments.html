<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>招募管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>招募管理</h4>
        <div>
            <a class="btn btn-primary btn-sm" href="/admin/recruitments/new">发布招募</a>
            <a class="btn btn-outline-secondary btn-sm" href="/dashboard">返回</a>
        </div>
    </div>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>标题</th>
            <th>状态</th>
            <th>时间</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${list}">
            <td th:text="${r.id}"></td>
            <td th:text="${r.title}"></td>
            <td th:text="${r.status}"></td>
            <td><span th:text="${r.startTime}"></span> ~ <span th:text="${r.endTime}"></span></td>
            <td class="d-flex gap-2">
                <a class="btn btn-sm btn-outline-primary" th:href="@{'/admin/recruitments/' + ${r.id} + '/edit'}">编辑</a>
                <form th:action="@{'/admin/recruitments/' + ${r.id} + '/delete'}" method="post">
                    <button class="btn btn-sm btn-outline-danger" type="submit">删除</button>
                </form>
                <a class="btn btn-sm btn-outline-success" th:href="@{'/admin/recruitments/' + ${r.id} + '/applications'}">报名</a>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
