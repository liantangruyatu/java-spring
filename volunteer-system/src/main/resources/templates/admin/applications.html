<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>报名管理</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>报名管理 - 招募ID: <span th:text="${recruitmentId}"></span></h4>
        <a class="btn btn-outline-secondary btn-sm" href="/admin/recruitments">返回</a>
    </div>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>ID</th>
            <th>志愿者</th>
            <th>状态</th>
            <th>备注</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${apps}">
            <td th:text="${a.id}"></td>
            <td th:text="${a.volunteer.user.fullName}"></td>
            <td th:text="${a.status}"></td>
            <td th:text="${a.remark}"></td>
            <td class="d-flex gap-2">
                <form th:action="@{'/admin/applications/' + ${a.id} + '/status'}" method="post">
                    <button class="btn btn-sm btn-success" name="status" value="1" type="submit">通过</button>
                </form>
                <form th:action="@{'/admin/applications/' + ${a.id} + '/status'}" method="post">
                    <button class="btn btn-sm btn-danger" name="status" value="2" type="submit">拒绝</button>
                </form>
                <form th:action="@{'/admin/applications/' + ${a.id} + '/status'}" method="post">
                    <button class="btn btn-sm btn-secondary" name="status" value="3" type="submit">取消</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
