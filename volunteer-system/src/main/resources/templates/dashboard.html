<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>首页</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">志愿者管理系统</a>
        <div class="d-flex">
            <span class="navbar-text text-white me-3" th:text="${user.fullName}"></span>
            <a class="btn btn-outline-light btn-sm" href="/logout">退出</a>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <h4>欢迎，<span th:text="${user.fullName}">用户</span></h4>
    <p>请选择功能：</p>
    <div class="row">
        <div class="col-md-6">
            <div class="card mb-3">
                <div class="card-header">志愿者功能</div>
                <div class="card-body">
                    <ul class="list-unstyled">
                        <li class="mb-2"><a href="/volunteer/profile" class="btn btn-outline-primary btn-sm w-100">我的资料</a></li>
                        <li class="mb-2"><a href="/volunteer/recruitments" class="btn btn-outline-primary btn-sm w-100">查看招募并报名</a></li>
                        <li class="mb-2"><a href="/volunteer/service-records" class="btn btn-outline-primary btn-sm w-100">服务记录</a></li>
                        <li><a href="/volunteer/training-records" class="btn btn-outline-primary btn-sm w-100">培训记录</a></li>
                    </ul>
                </div>
            </div>
        </div>
        <div class="col-md-6" th:if="${user.role.name == 'ADMIN'}">
            <div class="card mb-3">
                <div class="card-header">管理员功能</div>
                <div class="card-body">
                    <ul class="list-unstyled">
                        <li class="mb-2"><a href="/admin/users" class="btn btn-outline-success btn-sm w-100">用户管理</a></li>
                        <li class="mb-2"><a href="/admin/volunteers" class="btn btn-outline-success btn-sm w-100">志愿者审核</a></li>
                        <li><a href="/admin/recruitments" class="btn btn-outline-success btn-sm w-100">招募管理</a></li>
                    </ul>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
