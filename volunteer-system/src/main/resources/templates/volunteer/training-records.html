<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>培训记录</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">志愿者管理系统</a>
        <div class="d-flex">
            <a class="btn btn-outline-light btn-sm" href="/logout">退出</a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>培训记录</h4>
        <a class="btn btn-outline-secondary btn-sm" href="/dashboard">返回</a>
    </div>
    
    <div class="card mb-4">
        <div class="card-header">添加培训记录</div>
        <div class="card-body">
            <form th:action="@{/volunteer/training-records/save}" method="post">
                <input type="hidden" name="volunteerId" th:value="${volunteerId}">
                <div class="row">
                    <div class="col-md-4 mb-3">
                        <label class="form-label">培训主题</label>
                        <input type="text" name="topic" class="form-control" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">培训日期</label>
                        <input type="date" name="trainingDate" class="form-control" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">培训结果</label>
                        <input type="text" name="result" class="form-control" placeholder="如：合格、优秀" required>
                    </div>
                    <div class="col-md-2 mb-3 d-flex align-items-end">
                        <button type="submit" class="btn btn-primary w-100">添加</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>培训主题</th>
            <th>培训日期</th>
            <th>培训结果</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${records == null || records.isEmpty()}">
            <td colspan="3" class="text-center text-muted">暂无培训记录</td>
        </tr>
        <tr th:each="r : ${records}">
            <td th:text="${r.topic}"></td>
            <td th:text="${r.trainingDate}"></td>
            <td th:text="${r.result}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
