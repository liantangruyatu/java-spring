<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>我的资料</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4" style="max-width: 720px;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>志愿者资料</h4>
        <a class="btn btn-outline-secondary btn-sm" href="/dashboard">返回</a>
    </div>
    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>
    <form method="post" action="/volunteer/profile">
        <div class="row mb-3">
            <div class="col">
                <label class="form-label">性别</label>
                <input class="form-control" name="gender" th:value="${volunteer?.gender}">
            </div>
            <div class="col">
                <label class="form-label">身份证号</label>
                <input class="form-control" name="idCard" th:value="${volunteer?.idCard}">
            </div>
        </div>
        <div class="mb-3">
            <label class="form-label">地址</label>
            <input class="form-control" name="address" th:value="${volunteer?.address}">
        </div>
        <div class="mb-3">
            <label class="form-label">审核状态</label>
            <input class="form-control" disabled th:value="${volunteer?.auditStatus}">
        </div>
        <button class="btn btn-primary" type="submit">保存</button>
    </form>
</div>
</body>
</html>
