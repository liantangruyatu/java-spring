<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>招募列表</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>可报名的活动</h4>
        <a class="btn btn-outline-secondary btn-sm" href="/dashboard">返回</a>
    </div>
    <div th:if="${msg}" class="alert alert-success" th:text="${msg}"></div>
    <table class="table table-bordered">
        <thead>
        <tr>
            <th>标题</th>
            <th>地点</th>
            <th>时间</th>
            <th>名额</th>
            <th>操作</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="r : ${list}">
            <td th:text="${r.title}"></td>
            <td th:text="${r.location}"></td>
            <td><span th:text="${r.startTime}"></span> ~ <span th:text="${r.endTime}"></span></td>
            <td th:text="${r.maxVolunteers}"></td>
            <td>
                <form th:action="@{'/volunteer/recruitments/' + ${r.id} + '/apply'}" method="post">
                    <button class="btn btn-sm btn-primary" type="submit">报名</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>

    <h5 class="mt-4">我的报名</h5>
    <table class="table table-sm table-striped">
        <thead>
        <tr>
            <th>活动ID</th>
            <th>状态</th>
            <th>备注</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="a : ${myApps}">
            <td th:text="${a.recruitment.id}"></td>
            <td th:text="${a.status}"></td>
            <td th:text="${a.remark}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
