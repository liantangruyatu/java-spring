<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>服务记录</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark bg-primary">
    <div class="container-fluid">
        <a class="navbar-brand" href="/dashboard">志愿者管理系统</a>
        <div class="d-flex">
            <a class="btn btn-outline-light btn-sm" href="/logout">退出</a>
        </div>
    </div>
</nav>
<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4>服务记录</h4>
        <a class="btn btn-outline-secondary btn-sm" href="/dashboard">返回</a>
    </div>
    
    <div class="card mb-4">
        <div class="card-header">添加服务记录</div>
        <div class="card-body">
            <form th:action="@{/volunteer/service-records/save}" method="post">
                <input type="hidden" name="volunteerId" th:value="${volunteerId}">
                <div class="row">
                    <div class="col-md-3 mb-3">
                        <label class="form-label">服务日期</label>
                        <input type="date" name="serviceDate" class="form-control" required>
                    </div>
                    <div class="col-md-2 mb-3">
                        <label class="form-label">服务时长(小时)</label>
                        <input type="number" step="0.5" name="hours" class="form-control" required>
                    </div>
                    <div class="col-md-4 mb-3">
                        <label class="form-label">服务内容</label>
                        <input type="text" name="content" class="form-control" required>
                    </div>
                    <div class="col-md-3 mb-3">
                        <label class="form-label">评价</label>
                        <input type="text" name="evaluation" class="form-control">
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">添加</button>
            </form>
        </div>
    </div>

    <table class="table table-bordered table-striped">
        <thead>
        <tr>
            <th>服务日期</th>
            <th>服务时长(小时)</th>
            <th>服务内容</th>
            <th>评价</th>
        </tr>
        </thead>
        <tbody>
        <tr th:if="${records == null || records.isEmpty()}">
            <td colspan="4" class="text-center text-muted">暂无服务记录</td>
        </tr>
        <tr th:each="r : ${records}">
            <td th:text="${r.serviceDate}"></td>
            <td th:text="${r.hours}"></td>
            <td th:text="${r.content}"></td>
            <td th:text="${r.evaluation}"></td>
        </tr>
        </tbody>
    </table>
</div>
</body>
</html>
