<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - 创新创业项目申报管理系统</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.7.14/dist/vue.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@1.6.0/dist/axios.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
            width: 900px;
            max-width: 95%;
            display: flex;
        }
        
        .login-left {
            flex: 1;
            background: linear-gradient(135deg, #2196F3 0%, #1976D2 100%);
            padding: 60px 40px;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        
        .login-left h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        
        .login-left p {
            font-size: 1.1em;
            line-height: 1.6;
            opacity: 0.9;
        }
        
        .login-right {
            flex: 1;
            padding: 60px 40px;
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .login-header h2 {
            color: #1976D2;
            font-size: 2em;
            margin-bottom: 10px;
        }
        
        .user-type-tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }
        
        .user-type-tab {
            flex: 1;
            padding: 12px;
            border: 2px solid #E3F2FD;
            background: white;
            color: #1976D2;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .user-type-tab:hover {
            background: #E3F2FD;
        }
        
        .user-type-tab.active {
            background: #2196F3;
            color: white;
            border-color: #2196F3;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
        }
        
        .form-group input {
            width: 100%;
            padding: 14px;
            border: 2px solid #E3F2FD;
            border-radius: 8px;
            font-size: 15px;
            transition: border-color 0.3s;
        }
        
        .form-group input:focus {
            outline: none;
            border-color: #2196F3;
        }
        
        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #2196F3;
            color: white;
        }
        
        .btn-primary:hover {
            background: #1976D2;
            transform: translateY(-2px);
            box-shadow: 0 6px 15px rgba(33, 150, 243, 0.4);
        }
        
        .link-text {
            text-align: center;
            margin-top: 20px;
            color: #666;
        }
        
        .link-text a {
            color: #2196F3;
            text-decoration: none;
            font-weight: bold;
        }
        
        .link-text a:hover {
            text-decoration: underline;
        }
        
        .message {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }
        
        .message.success {
            background: #E8F5E9;
            color: #2E7D32;
            border: 1px solid #A5D6A7;
        }
        
        .message.error {
            background: #FFEBEE;
            color: #C62828;
            border: 1px solid #EF9A9A;
        }
        
        .message.active {
            display: block;
        }
        
        @media (max-width: 768px) {
            .login-container {
                flex-direction: column;
            }
            
            .login-left {
                padding: 40px 20px;
            }
            
            .login-right {
                padding: 40px 20px;
            }
        }
    </style>
</head>
<body>
    <div id="app" class="login-container">
        <div class="login-left">
            <h1>🚀 创新创业<br>项目申报管理系统</h1>
            <p>Innovation and Entrepreneurship Project Management System</p>
            <p style="margin-top: 20px;">助力创新创业项目申报与管理，提升工作效率</p>
        </div>
        
        <div class="login-right">
            <div class="login-header">
                <h2>{{ isLogin ? '登录' : '注册' }}</h2>
            </div>
            
            <div v-if="message.text" :class="['message', 'active', message.type]">
                {{ message.text }}
            </div>
            
            <div class="user-type-tabs">
                <button 
                    class="user-type-tab" 
                    :class="{active: userType === 'teacher'}"
                    @click="userType = 'teacher'">
                    教师
                </button>
                <button 
                    class="user-type-tab" 
                    :class="{active: userType === 'student'}"
                    @click="userType = 'student'">
                    学生
                </button>
            </div>
            
            <!-- 登录表单 -->
            <form v-if="isLogin" @submit.prevent="handleLogin">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" v-model="loginForm.username" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" v-model="loginForm.password" placeholder="请输入密码" required>
                </div>
                <button type="submit" class="btn btn-primary">登录</button>
                <div class="link-text">
                    还没有账号？<a href="#" @click.prevent="isLogin = false">立即注册</a>
                </div>
            </form>
            
            <!-- 注册表单 -->
            <form v-else @submit.prevent="handleRegister">
                <div class="form-group">
                    <label>用户名 *</label>
                    <input type="text" v-model="registerForm.username" placeholder="请输入用户名" required>
                </div>
                <div class="form-group">
                    <label>密码 *</label>
                    <input type="password" v-model="registerForm.password" placeholder="请输入密码" required>
                </div>
                <div class="form-group">
                    <label>姓名 *</label>
                    <input type="text" v-model="registerForm.name" placeholder="请输入真实姓名" required>
                </div>
                
                <!-- 教师专属字段 -->
                <template v-if="userType === 'teacher'">
                    <div class="form-group">
                        <label>学院 *</label>
                        <input type="text" v-model="registerForm.college" placeholder="请输入学院" required>
                    </div>
                    <div class="form-group">
                        <label>职称</label>
                        <input type="text" v-model="registerForm.title" placeholder="请输入职称">
                    </div>
                </template>
                
                <!-- 学生专属字段 -->
                <template v-if="userType === 'student'">
                    <div class="form-group">
                        <label>专业 *</label>
                        <input type="text" v-model="registerForm.major" placeholder="请输入专业" required>
                    </div>
                    <div class="form-group">
                        <label>班级</label>
                        <input type="text" v-model="registerForm.className" placeholder="请输入班级">
                    </div>
                </template>
                
                <div class="form-group">
                    <label>电话</label>
                    <input type="text" v-model="registerForm.phone" placeholder="请输入联系电话">
                </div>
                <div class="form-group">
                    <label>邮箱</label>
                    <input type="email" v-model="registerForm.email" placeholder="请输入邮箱">
                </div>
                
                <button type="submit" class="btn btn-primary">注册</button>
                <div class="link-text">
                    已有账号？<a href="#" @click.prevent="isLogin = true">立即登录</a>
                </div>
            </form>
        </div>
    </div>
    
    <script>
        new Vue({
            el: '#app',
            data: {
                isLogin: true,
                userType: 'teacher',
                message: { text: '', type: '' },
                loginForm: {
                    username: '',
                    password: ''
                },
                registerForm: {
                    username: '',
                    password: '',
                    name: '',
                    college: '',
                    title: '',
                    major: '',
                    className: '',
                    phone: '',
                    email: ''
                }
            },
            methods: {
                showMessage(text, type) {
                    this.message = { text, type };
                    setTimeout(() => {
                        this.message = { text: '', type: '' };
                    }, 3000);
                },
                
                handleLogin() {
                    const data = {
                        username: this.loginForm.username,
                        password: this.loginForm.password,
                        userType: this.userType
                    };
                    
                    axios.post('/api/auth/login', data)
                        .then(res => {
                            if (res.data.success) {
                                this.showMessage(res.data.message, 'success');
                                // 保存登录信息到 localStorage
                                localStorage.setItem('userInfo', JSON.stringify(res.data));
                                // 跳转到主页
                                setTimeout(() => {
                                    window.location.href = '/system.html';
                                }, 1000);
                            } else {
                                this.showMessage(res.data.message, 'error');
                            }
                        })
                        .catch(err => {
                            this.showMessage('登录失败，请稍后重试', 'error');
                            console.error(err);
                        });
                },
                
                handleRegister() {
                    const data = {
                        username: this.registerForm.username,
                        password: this.registerForm.password,
                        name: this.registerForm.name,
                        userType: this.userType,
                        phone: this.registerForm.phone,
                        email: this.registerForm.email
                    };
                    
                    if (this.userType === 'teacher') {
                        data.college = this.registerForm.college;
                        data.title = this.registerForm.title;
                    } else {
                        data.major = this.registerForm.major;
                        data.className = this.registerForm.className;
                    }
                    
                    axios.post('/api/auth/register', data)
                        .then(res => {
                            if (res.data.success) {
                                this.showMessage(res.data.message, 'success');
                                setTimeout(() => {
                                    this.isLogin = true;
                                    this.registerForm = {};
                                }, 1500);
                            } else {
                                this.showMessage(res.data.message, 'error');
                            }
                        })
                        .catch(err => {
                            this.showMessage('注册失败，请稍后重试', 'error');
                            console.error(err);
                        });
                }
            }
        });
    </script>
</body>
</html>
